# Builds the Android app (APK) and the Windows installer, and attaches both to a
# GitHub release. Runs when a version tag (v1.2.3) is pushed, using the tag's message
# as the release notes; or by hand from the Actions tab: given a version, it tags the
# commit it runs on and releases it with the notes given, and without one it only
# builds (the files are then kept as workflow artifacts).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.2.3 (must match package.json). Blank: just build.'
        required: false
        default: ''
      notes:
        description: 'Release notes (Markdown)'
        required: false
        default: ''

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  # Makes the release first, so both builds have somewhere to attach their files.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: env.TAG != ''

      - name: Create the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then echo "::error::$TAG does not match package.json ($VERSION)"; exit 1; fi
          if gh release view "$TAG" > /dev/null 2>&1; then echo "$TAG is already released: adding the files to it."; exit 0; fi
          if [ "${{ github.event_name }}" = push ]; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" # checkout leaves out the tag's message
            gh release create "$TAG" --title "Onyx Calendar $VERSION" --notes-from-tag
          else
            printf '%s\n' "${NOTES:-See the README for setup.}" > notes.md
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Onyx Calendar $VERSION" --notes-file notes.md
          fi

  apk:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        # --ignore-scripts: the desktop app's Electron download isn't needed here.
        run: |
          npm ci --ignore-scripts
          npm ci --prefix mobile

      - name: Build the app's web files
        run: npm run mobile

      - name: Update the Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Signing key
        env:
          ONYX_KEYSTORE: ${{ secrets.ONYX_KEYSTORE }}
        run: |
          if [ -z "$ONYX_KEYSTORE" ]; then echo "::error::The ONYX_KEYSTORE secret is missing"; exit 1; fi
          echo "$ONYX_KEYSTORE" | base64 -d > mobile/android/app/release.p12

      - name: Build the APK
        working-directory: mobile/android
        env:
          ONYX_KEY_PASSWORD: ${{ secrets.ONYX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name it
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "Onyx-Calendar-$VERSION.apk"
          echo "APK=Onyx-Calendar-$VERSION.apk" >> "$GITHUB_ENV"
          rm -f mobile/android/app/release.p12

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK }}

      - name: Attach it to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$APK" --clobber

  # The PC app's installer, and latest.yml, which tells installed copies an update is out.
  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build the installer
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Attach it to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.exe dist/*.blockmap dist/latest.yml --clobber
