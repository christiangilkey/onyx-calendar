# Builds the Android app (APK) and the Windows installer, and attaches both to the
# GitHub release for the tag, whose notes are the tag's message. Runs when a version
# tag (v1.2.3) is pushed, or by hand from the Actions tab (then the builds are only
# kept as workflow artifacts).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        # --ignore-scripts: the desktop app's Electron download isn't needed here.
        run: |
          npm ci --ignore-scripts
          npm ci --prefix mobile

      - name: Build the app's web files
        run: npm run mobile

      - name: Update the Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Signing key
        env:
          ONYX_KEYSTORE: ${{ secrets.ONYX_KEYSTORE }}
        run: |
          if [ -z "$ONYX_KEYSTORE" ]; then echo "::error::The ONYX_KEYSTORE secret is missing"; exit 1; fi
          echo "$ONYX_KEYSTORE" | base64 -d > mobile/android/app/release.p12

      - name: Build the APK
        working-directory: mobile/android
        env:
          ONYX_KEY_PASSWORD: ${{ secrets.ONYX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name it
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "Onyx-Calendar-$VERSION.apk"
          echo "APK=Onyx-Calendar-$VERSION.apk" >> "$GITHUB_ENV"
          rm -f mobile/android/app/release.p12

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK }}

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both jobs may get here first: whichever does creates the release.
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Onyx Calendar ${GITHUB_REF_NAME#v}" --notes-from-tag || true
          for i in 1 2 3 4 5; do gh release upload "$GITHUB_REF_NAME" "$APK" --clobber && exit 0; sleep 10; done
          exit 1

  # The PC app's installer, and latest.yml, which tells installed copies an update is out.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build the installer
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Onyx Calendar ${GITHUB_REF_NAME#v}" --notes-from-tag || true
          for i in 1 2 3 4 5; do gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/*.blockmap dist/latest.yml --clobber && exit 0; sleep 10; done
          exit 1
