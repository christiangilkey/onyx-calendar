<!doctype html>
<!-- The on-screen popup (main.js, showAlert): what is coming when the Pi phones about it,
     and what is starting. A small window of its own, so it shows over anything. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Onyx</title>
  <style>
    :root { --c: #8b7cff; --text: #f1f1f4; --muted: #9a9aa6; --line: #26262c; }
    html, body { margin: 0; height: 100%; background: #0b0b0e; color: var(--text); font: 13px/1.4 'Segoe UI', system-ui, sans-serif; overflow: hidden; user-select: none; }
    body { box-sizing: border-box; border: 1px solid #2c2c33; border-top: 3px solid var(--c); display: flex; flex-direction: column; padding: 12px 14px 12px 16px; -webkit-app-region: drag; }
    .head { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--c); }
    .head svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    body.call .head svg { animation: shake .9s ease-in-out infinite; transform-origin: 50% 60%; }
    @keyframes shake { 0%, 60%, 100% { transform: rotate(0); } 10%, 30%, 50% { transform: rotate(-14deg); } 20%, 40% { transform: rotate(14deg); } }
    .grow { flex: 1; }
    .close { -webkit-app-region: no-drag; border: 0; background: transparent; color: var(--muted); width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 16px; line-height: 1; }
    .close:hover { color: var(--text); background: rgba(255,255,255,.08); }
    .title { font-size: 18px; font-weight: 650; margin: 6px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .when { color: var(--muted); font-size: 13px; }
    .when b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
    .row { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; -webkit-app-region: no-drag; }
    button.btn { flex: 1; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: #17171b; color: var(--text); font: 600 12.5px/1 inherit; font-family: inherit; cursor: pointer; }
    button.btn:hover { background: #202026; }
    button.btn.primary { background: #fff; color: #000; border-color: #fff; }
    button.btn.primary:hover { background: #e4e4ea; }
    body.enter { animation: enter .28s cubic-bezier(.2, .9, .3, 1.2); }
    @keyframes enter { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  </style>
</head>
<body class="enter">
  <div class="head"><span id="icon"></span><span id="kind"></span><span class="grow"></span><button class="close" id="x" title="Close (Esc)">×</button></div>
  <div class="title" id="title"></div>
  <div class="when" id="when"></div>
  <div class="row">
    <button class="btn primary" id="open">Open</button>
    <button class="btn" id="snooze">Snooze 5 min</button>
    <button class="btn" id="ok">Got it</button>
  </div>
  <script src="alert.js"></script>
</body>
</html>
