<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; font-src 'self' data:; frame-src https://www.youtube-nocookie.com">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Onyx Calendar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="titlebar">
    <button id="menu" class="icon-btn mobile-only" title="Calendars and tags"></button>
    <div class="brand"><span class="mark"></span>Onyx</div>
    <div class="nav">
      <button id="today" class="btn">Today</button>
      <button id="prev" class="icon-btn" title="Previous (←)"></button>
      <button id="next" class="icon-btn" title="Next (→)"></button>
      <h1 id="range"></h1>
    </div>
    <div class="grow"></div>
    <div id="pomo-timer" hidden></div>
    <div id="views" class="segmented">
      <button data-view="timeGridDay">Day</button>
      <button data-view="timeGridWeek">Week</button>
      <button data-view="dayGridMonth">Month</button>
      <button data-view="listWeek">Agenda</button>
    </div>
    <button id="globe-toggle" class="icon-btn globe-btn" title="Globe view (G)"></button>
    <button id="undo-btn" class="icon-btn" title="Nothing to undo" disabled></button>
    <button id="update-btn" class="icon-btn" title="Check for updates"></button>
    <button id="refresh" class="icon-btn" title="Refresh (R)"></button>
    <button id="toggle-tasks" class="icon-btn" title="Tasks"></button>
    <button id="open-settings" class="icon-btn" title="Settings"></button>
  </header>
  <!-- Now / Next: how much time is left before the next obligation (app.js, tickNext) -->
  <div id="next-bar" hidden></div>

  <div id="layout">
    <aside id="sidebar">
      <button id="new-block" class="btn primary wide"></button>
      <div id="views-mobile" class="segmented mobile-only">
        <button data-view="timeGridDay">Day</button>
        <button data-view="timeGrid3">3 days</button>
        <button data-view="dayGridMonth">Month</button>
        <button data-view="listWeek">Agenda</button>
      </div>
      <div id="mini"></div>
      <div id="calendars"></div>
      <div id="goal-list"></div>
      <div id="tag-list"></div>
      <button id="add-calendar" class="btn ghost wide"></button>
    </aside>

    <main id="stage">
      <div id="calendar"></div>
      <section id="graph" hidden>
        <canvas id="graph-canvas"></canvas>
        <div id="graph-bar"></div>
        <div id="graph-clusters"></div>
        <div id="graph-empty" hidden>Nothing here yet. Add a note, pin a Notion page or Drive file, or try a longer range.</div>
        <div id="graph-hint">Drag to spin · click a cluster to open it and see its names · click an item to open it · drag an item onto a cluster to move it · double-click to reset</div>
        <div id="graph-foot"><span id="graph-stats"></span><button id="graph-reset" class="icon-btn" title="Reset the view (or double-click the graph)"></button></div>
      </section>
    </main>

    <aside id="tasks">
      <div class="panel-head">
        <h2>Tasks</h2>
        <span id="task-count" class="count"></span>
        <div class="grow"></div>
        <div id="task-tabs" class="segmented">
          <button data-tab="open" class="on">Open</button>
          <button data-tab="archived">Archived</button>
        </div>
      </div>
      <div id="archive-bar" hidden>
        <button id="archive-prev" class="icon-btn" title="Previous day"></button>
        <input id="archive-date" type="date" title="Show tasks completed on this day">
        <button id="archive-next" class="icon-btn" title="Next day"></button>
        <button id="archive-today" class="btn">Today</button>
      </div>
      <form id="task-add">
        <div class="task-add-row">
          <input id="task-title" type="text" placeholder="Add a task…  e.g. Dentist 3pm" autocomplete="off" spellcheck="false">
          <select id="task-list" title="Task list"></select>
          <button type="submit" class="btn primary" id="task-submit">Add</button>
        </div>
        <div class="task-add-row">
          <input id="task-date" type="date" title="Due date (optional)">
          <button type="button" class="btn quick-date" data-days="0">Today</button>
          <button type="button" class="btn quick-date" data-days="1">Tomorrow</button>
        </div>
      </form>
      <div id="task-items"></div>
    </aside>

    <aside id="news">
      <button id="news-tab" title="News: the latest stories from YouTube news channels"><span class="news-tab-label">News</span></button>
      <div id="news-body">
        <div class="panel-head">
          <h2>News</h2>
          <span id="news-updated" class="count"></span>
          <div class="grow"></div>
          <button id="news-tamkeen" class="tamkeen-toggle" aria-pressed="false" hidden>Tamkeen</button>
          <button id="news-channels" class="icon-btn" title="Pick news channels"></button>
          <button id="news-refresh" class="icon-btn" title="Check for new stories"></button>
          <button id="news-close" class="icon-btn" title="Collapse the News tab"></button>
        </div>
        <div id="news-player"></div>
        <div id="news-filter"></div>
        <div id="news-list"></div>
      </div>
    </aside>
  </div>

  <div id="scrim"></div>
  <button id="fab" class="mobile-only" title="New block"></button>
  <div id="popover" hidden></div>
  <div id="modal" hidden></div>
  <div id="connect" hidden></div>
  <div id="update-dialog" hidden></div>
  <div id="toasts"></div>

  <script src="../../node_modules/fullcalendar/index.global.min.js"></script>
  <script src="remote.js"></script>
  <script src="mock.js"></script>
  <script src="graph.js"></script>
  <script src="app.js"></script>
</body>
</html>
